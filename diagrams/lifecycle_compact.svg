<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A37"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24457A"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker>
<marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker>
</defs><rect width="1180" height="430" fill="#FFFFFF"/><text x="0" y="20" font-size="18" font-weight="600" fill="#1F2A37" text-anchor="start">The five stages, and what leaks at each</text><text x="0" y="42" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Dashed stages leave no record in Clever today, which is why these failures are invisible rather than merely unfixed.</text><rect x="0" y="66" width="208" height="150" rx="6" fill="#FFFFFF" stroke="#5B6573" stroke-width="1.5" stroke-dasharray="6 5"/><text x="16" y="94" font-size="16" font-weight="600" fill="#5B6573" text-anchor="start">1. Received</text><line x1="16" y1="106" x2="192" y2="106" stroke="#D5D9E0" stroke-width="1"/><text x="16" y="126" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">received_at exists, but not</text><text x="16" y="143" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">when Clever ingested it</text><text x="16" y="166" font-size="13" font-weight="400" fill="#5B6573" text-anchor="start">Start the SLA clock</text><line x1="211" y1="141.0" x2="226" y2="141.0" stroke="#1F2A37" stroke-width="1.4" marker-end="url(#arr)"/><line x1="104.0" y1="216" x2="104.0" y2="242" stroke="#B42318" stroke-width="1.4"/><circle cx="104.0" cy="242" r="3" fill="#B42318"/><text x="16" y="288" font-size="32" font-weight="600" fill="#B42318" text-anchor="start">20</text><text x="16" y="312" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">LeadBridge leads waited 3–6</text><text x="16" y="329" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">hours for a first touch</text><rect x="233" y="66" width="208" height="150" rx="6" fill="#FFFFFF" stroke="#5B6573" stroke-width="1.5" stroke-dasharray="6 5"/><text x="249" y="94" font-size="16" font-weight="600" fill="#5B6573" text-anchor="start">2. Routed</text><line x1="249" y1="106" x2="425" y2="106" stroke="#D5D9E0" stroke-width="1"/><text x="249" y="126" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">Nothing is logged</text><text x="249" y="149" font-size="13" font-weight="400" fill="#5B6573" text-anchor="start">Know the destination, or the</text><text x="249" y="166" font-size="13" font-weight="400" fill="#5B6573" text-anchor="start">skip reason</text><line x1="444" y1="141.0" x2="459" y2="141.0" stroke="#1F2A37" stroke-width="1.4" marker-end="url(#arr)"/><line x1="337.0" y1="216" x2="337.0" y2="242" stroke="#B42318" stroke-width="1.4"/><circle cx="337.0" cy="242" r="3" fill="#B42318"/><text x="249" y="288" font-size="32" font-weight="600" fill="#B42318" text-anchor="start">18</text><text x="249" y="312" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">OfferNest leads reached the</text><text x="249" y="329" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">database but never the dialer</text><rect x="466" y="66" width="208" height="150" rx="6" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="482" y="94" font-size="16" font-weight="600" fill="#1F2A37" text-anchor="start">3. First touch</text><line x1="482" y1="106" x2="658" y2="106" stroke="#D5D9E0" stroke-width="1"/><text x="482" y="126" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">First attempt on a working</text><text x="482" y="143" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">channel</text><text x="482" y="166" font-size="13" font-weight="400" fill="#5B6573" text-anchor="start">95% within 15 min</text><line x1="677" y1="141.0" x2="692" y2="141.0" stroke="#1F2A37" stroke-width="1.4" marker-end="url(#arr)"/><line x1="570.0" y1="216" x2="570.0" y2="242" stroke="#B42318" stroke-width="1.4"/><circle cx="570.0" cy="242" r="3" fill="#B42318"/><text x="482" y="288" font-size="32" font-weight="600" fill="#B42318" text-anchor="start">12</text><text x="482" y="312" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">leads were texted a landline 2–3</text><text x="482" y="329" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">times and never called</text><rect x="699" y="66" width="208" height="150" rx="6" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="715" y="94" font-size="16" font-weight="600" fill="#1F2A37" text-anchor="start">4. Follow-up</text><line x1="715" y1="106" x2="891" y2="106" stroke="#D5D9E0" stroke-width="1"/><text x="715" y="126" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">Attempts 2 and 3</text><text x="715" y="149" font-size="13" font-weight="400" fill="#5B6573" text-anchor="start">Full cadence, inside 8am-9pm</text><text x="715" y="166" font-size="13" font-weight="400" fill="#5B6573" text-anchor="start">local</text><line x1="910" y1="141.0" x2="925" y2="141.0" stroke="#1F2A37" stroke-width="1.4" marker-end="url(#arr)"/><line x1="803.0" y1="216" x2="803.0" y2="242" stroke="#B42318" stroke-width="1.4"/><circle cx="803.0" cy="242" r="3" fill="#B42318"/><text x="715" y="288" font-size="32" font-weight="600" fill="#B42318" text-anchor="start">45</text><text x="715" y="312" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">leads stopped after one or two</text><text x="715" y="329" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">touches</text><rect x="932" y="66" width="208" height="150" rx="6" fill="#FFFFFF" stroke="#5B6573" stroke-width="1.5" stroke-dasharray="6 5"/><text x="948" y="94" font-size="16" font-weight="600" fill="#5B6573" text-anchor="start">5. Outcome</text><line x1="948" y1="106" x2="1124" y2="106" stroke="#D5D9E0" stroke-width="1"/><text x="948" y="126" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">Nothing is written back</text><text x="948" y="149" font-size="13" font-weight="400" fill="#5B6573" text-anchor="start">Truthful status within 5 min</text><line x1="1036.0" y1="216" x2="1036.0" y2="242" stroke="#B42318" stroke-width="1.4"/><circle cx="1036.0" cy="242" r="3" fill="#B42318"/><text x="948" y="288" font-size="32" font-weight="600" fill="#B42318" text-anchor="start">188</text><text x="948" y="312" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">worked leads whose status still</text><text x="948" y="329" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">says “new”</text><rect x="0" y="384" width="1180" height="34" rx="5" fill="#FEF3F2"/><text x="14" y="406" font-size="13.5" font-weight="600" fill="#B42318" text-anchor="start">Also at stage 4:</text><text x="117.90625" y="406" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">10 texts sent without SMS consent · up to 73 attempts outside 8am–9pm local, 27 between midnight and 6am* · 5 leads called after we had already spoken to them.</text></svg>