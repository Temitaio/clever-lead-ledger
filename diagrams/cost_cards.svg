<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 252" width="1180" height="252" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A37"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24457A"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker>
<marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker>
</defs><rect width="1180" height="252" fill="#FFFFFF"/><text x="0" y="20" font-size="19" font-weight="600" fill="#1F2A37" text-anchor="start">What the leak is costing</text><rect x="0" y="40" width="272" height="204" rx="7" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.4"/><rect x="0" y="40" width="272" height="4" rx="0" fill="#12B76A"/><text x="18" y="70" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">RECOVERABLE VOLUME</text><text x="18" y="114" font-size="40" font-weight="600" fill="#12B76A" text-anchor="start">~36</text><text x="100.0" y="114" font-size="13.5" font-weight="600" fill="#1F2A37" text-anchor="start">more conversations</text><text x="18" y="150" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">+40% on the 89 we have today, from</text><text x="18" y="167" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">leads already paid for.</text><line x1="18" y1="188" x2="254" y2="188" stroke="#D5D9E0" stroke-width="1"/><text x="18" y="208" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">47% of first-call misses connect on a</text><text x="18" y="223" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">completed follow-up.</text><rect x="302" y="40" width="272" height="204" rx="7" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.4"/><rect x="302" y="40" width="272" height="4" rx="0" fill="#1F2A37"/><text x="320" y="70" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">REVENUE AT RISK</text><text x="320" y="114" font-size="40" font-weight="600" fill="#1F2A37" text-anchor="start">$?</text><text x="373.71875" y="114" font-size="13.5" font-weight="600" fill="#1F2A37" text-anchor="start">needs 2 inputs from Clever</text><text x="320" y="150" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">175 recoverable conversations per</text><text x="320" y="167" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">1,000 leads × close rate × average</text><text x="320" y="184" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">referral value.</text><line x1="320" y1="205" x2="556" y2="205" stroke="#D5D9E0" stroke-width="1"/><text x="320" y="225" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">Example only: 5% × $2,500 ≈ $22k / 1,000</text><text x="320" y="240" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">leads.</text><rect x="604" y="40" width="272" height="204" rx="7" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.4"/><rect x="604" y="40" width="272" height="4" rx="0" fill="#B42318"/><text x="622" y="70" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">COMPLIANCE EXPOSURE</text><text x="622" y="114" font-size="40" font-weight="600" fill="#B42318" text-anchor="start">10</text><text x="680.0" y="114" font-size="13.5" font-weight="600" fill="#1F2A37" text-anchor="start">texts without consent</text><text x="622" y="150" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">Plus up to 73 attempts outside</text><text x="622" y="167" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">8am–9pm local, 27 of them between</text><text x="622" y="184" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">midnight and 6am.</text><line x1="622" y1="205" x2="858" y2="205" stroke="#D5D9E0" stroke-width="1"/><text x="622" y="225" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">Potential exposure per violation under the</text><text x="622" y="240" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">TCPA; confirm with Legal.</text><rect x="906" y="40" width="272" height="204" rx="7" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.4"/><rect x="906" y="40" width="272" height="4" rx="0" fill="#F79009"/><text x="924" y="70" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">PARTNER TRUST</text><text x="924" y="114" font-size="40" font-weight="600" fill="#F79009" text-anchor="start">60%</text><text x="924" y="134" font-size="13.5" font-weight="600" fill="#1F2A37" text-anchor="start">of OfferNest leads dropped</text><text x="924" y="165" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">Silently, for six days. A quarter of our</text><text x="924" y="182" font-size="13" font-weight="400" fill="#1F2A37" text-anchor="start">volume.</text><line x1="924" y1="203" x2="1160" y2="203" stroke="#D5D9E0" stroke-width="1"/><text x="924" y="223" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">They heard it from their own customers, not</text><text x="924" y="238" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">from us.</text></svg>