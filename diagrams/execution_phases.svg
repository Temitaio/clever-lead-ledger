<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A37"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24457A"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker>
<marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker>
</defs><rect width="1180" height="470" fill="#FFFFFF"/><text x="0" y="20" font-size="19" font-weight="600" fill="#1F2A37" text-anchor="start">From diagnosis to a durable operating system</text><text x="0" y="42" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Six phases. Timing stays visible so the sequence is testable, not aspirational.</text><rect x="0" y="53" width="11" height="11" rx="2" fill="#1F2A37"/><text x="17" y="62" font-size="12" font-weight="500" fill="#5B6573" text-anchor="start">I own / prototype</text><rect x="137.46875" y="53" width="11" height="11" rx="2" fill="#24457A"/><text x="154.46875" y="62" font-size="12" font-weight="500" fill="#5B6573" text-anchor="start">Engineering</text><rect x="244.625" y="53" width="11" height="11" rx="2" fill="#0E7C86"/><text x="261.625" y="62" font-size="12" font-weight="500" fill="#5B6573" text-anchor="start">Cross-functional</text><rect x="0" y="84" width="1180" height="56" rx="4" fill="#F7F9FB"/><text x="12" y="110" font-size="15.5" font-weight="600" fill="#1F2A37" text-anchor="start">1. Discovery</text><rect x="12" y="118" width="55.59375" height="17" rx="8" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1"/><text x="20" y="130" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">Week 1</text><text x="128" y="108" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">Understand the real failure modes</text><text x="128" y="124" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">before prescribing changes</text><circle cx="393.0" cy="102" r="2.5" fill="#1F2A37"/><text x="402.0" y="106" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Reconcile production data</text><circle cx="784.0" cy="102" r="2.5" fill="#1F2A37"/><text x="793.0" y="106" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Hand-trace a sample with Ops + Eng</text><circle cx="393.0" cy="121" r="2.5" fill="#0E7C86"/><text x="402.0" y="125" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Confirm SLA, cadence, consent rules</text><circle cx="784.0" cy="121" r="2.5" fill="#24457A"/><text x="793.0" y="125" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Inspect ingestion to telecom path</text><text x="12" y="172" font-size="15.5" font-weight="600" fill="#1F2A37" text-anchor="start">2. Define</text><rect x="12" y="180" width="67.125" height="17" rx="8" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1"/><text x="20" y="192" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">Week 1-2</text><text x="128" y="170" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">One shared definition of correct</text><text x="128" y="186" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">behaviour</text><circle cx="393.0" cy="164" r="2.5" fill="#1F2A37"/><text x="402.0" y="168" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">North star + lifecycle states</text><circle cx="784.0" cy="164" r="2.5" fill="#1F2A37"/><text x="793.0" y="168" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Exception taxonomy</text><circle cx="393.0" cy="183" r="2.5" fill="#1F2A37"/><text x="402.0" y="187" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Alert thresholds, recovery rules</text><circle cx="784.0" cy="183" r="2.5" fill="#0E7C86"/><text x="793.0" y="187" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Ownership model</text><rect x="0" y="208" width="1180" height="56" rx="4" fill="#F7F9FB"/><text x="12" y="234" font-size="15.5" font-weight="600" fill="#1F2A37" text-anchor="start">3. Delivery</text><rect x="12" y="242" width="72.75" height="17" rx="8" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1"/><text x="20" y="254" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">Weeks 2-4</text><text x="128" y="232" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">Fix the top leaks; instrument the</text><text x="128" y="248" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">missing stages</text><circle cx="393.0" cy="226" r="2.5" fill="#24457A"/><text x="402.0" y="230" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Lifecycle timestamps, skip reasons</text><circle cx="784.0" cy="226" r="2.5" fill="#24457A"/><text x="793.0" y="230" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Landline to call fallback</text><circle cx="393.0" cy="245" r="2.5" fill="#24457A"/><text x="402.0" y="249" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Status writeback, identity normalization</text><circle cx="784.0" cy="245" r="2.5" fill="#1F2A37"/><text x="793.0" y="249" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Ledger v1 + exception queue</text><text x="12" y="296" font-size="15.5" font-weight="600" fill="#1F2A37" text-anchor="start">4. Launch</text><rect x="12" y="304" width="59.3125" height="17" rx="8" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1"/><text x="20" y="316" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">Month 1</text><text x="128" y="294" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">Get it into daily use, not just shipped</text><circle cx="393.0" cy="288" r="2.5" fill="#1F2A37"/><text x="402.0" y="292" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Start with Ops + Product</text><circle cx="784.0" cy="288" r="2.5" fill="#1F2A37"/><text x="793.0" y="292" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Validate alerts against manual checks</text><circle cx="393.0" cy="307" r="2.5" fill="#0E7C86"/><text x="402.0" y="311" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Pilot partner scorecard internally</text><circle cx="784.0" cy="307" r="2.5" fill="#0E7C86"/><text x="793.0" y="311" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Train Ops on exception handling</text><rect x="0" y="332" width="1180" height="56" rx="4" fill="#F7F9FB"/><text x="12" y="358" font-size="15.5" font-weight="600" fill="#1F2A37" text-anchor="start">5. Monitor</text><rect x="12" y="366" width="75.265625" height="17" rx="8" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1"/><text x="20" y="378" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">Month 1 on</text><text x="128" y="356" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">Prove the system works, and that it is</text><text x="128" y="372" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">used</text><circle cx="393.0" cy="350" r="2.5" fill="#1F2A37"/><text x="402.0" y="354" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Six metrics + time to detect / recover</text><circle cx="784.0" cy="350" r="2.5" fill="#1F2A37"/><text x="793.0" y="354" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Exception-queue action rate</text><circle cx="393.0" cy="369" r="2.5" fill="#1F2A37"/><text x="402.0" y="373" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Alert precision, mute rate</text><circle cx="784.0" cy="369" r="2.5" fill="#0E7C86"/><text x="793.0" y="373" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Any surviving spreadsheet</text><text x="12" y="420" font-size="15.5" font-weight="600" fill="#1F2A37" text-anchor="start">6. Iterate</text><rect x="12" y="428" width="76.578125" height="17" rx="8" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1"/><text x="20" y="440" font-size="11.5" font-weight="600" fill="#5B6573" text-anchor="start">Months 2-3</text><text x="128" y="418" font-size="13" font-weight="500" fill="#1F2A37" text-anchor="start">Automate only what proves repeatable</text><circle cx="393.0" cy="412" r="2.5" fill="#24457A"/><text x="402.0" y="416" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Automate frequent recovery paths</text><circle cx="784.0" cy="412" r="2.5" fill="#0E7C86"/><text x="793.0" y="416" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Partner delivery agreements</text><circle cx="393.0" cy="431" r="2.5" fill="#1F2A37"/><text x="402.0" y="435" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Conversation-to-close attribution</text><circle cx="784.0" cy="431" r="2.5" fill="#1F2A37"/><text x="793.0" y="435" font-size="12.5" font-weight="400" fill="#1F2A37" text-anchor="start">Clean speed-to-lead experiments</text><text x="0" y="460" font-size="12" font-weight="400" fill="#5B6573" text-anchor="start">Effort is relative, not engineer-days: consent guard S  |  landline fallback S  |  lifecycle timestamps M  |  identity resolution M/L  |  cadence root cause unknown until traced  |  real-time ledger L</text></svg>