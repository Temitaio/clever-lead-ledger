<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 790" width="1600" height="790" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A37"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24457A"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker>
<marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6573"/></marker>
</defs><rect width="1600" height="790" fill="#FFFFFF"/><text x="40" y="62" font-size="30" font-weight="600" fill="#1F2A37" text-anchor="start">How the prototype works</text><text x="40" y="94" font-size="16" font-weight="400" fill="#5B6573" text-anchor="start">Four pieces. The Preset API key stays on the server; each reviewer gets a short-lived pass to one dashboard.</text><rect x="40" y="140" width="250" height="230" rx="8" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="60" y="174" font-size="18" font-weight="600" fill="#1F2A37" text-anchor="start">Extract files</text><text x="60" y="196" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">From Clever</text><text x="60" y="236" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">leads.csv</text><text x="60" y="255" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">206 leads from 6 partners</text><text x="60" y="296" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">outreach_log.csv</text><text x="60" y="315" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">379 call and text attempts</text><rect x="370" y="140" width="300" height="230" rx="8" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="390" y="174" font-size="18" font-weight="600" fill="#1F2A37" text-anchor="start">Neon Postgres</text><text x="390" y="196" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Clean copy of the data, as delivered</text><text x="390" y="236" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">leads</text><text x="390" y="255" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Typed columns, plus a normalized phone</text><text x="390" y="273" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">for matching people</text><text x="390" y="310" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">outreach_attempts</text><text x="390" y="329" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Every attempt linked to its lead</text><rect x="750" y="140" width="420" height="330" rx="8" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="770" y="174" font-size="18" font-weight="600" fill="#1F2A37" text-anchor="start">Preset workspace</text><text x="770" y="196" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Where the outcome logic and charts live</text><rect x="770" y="216" width="380" height="112" rx="6" fill="#F4F6F8"/><text x="786" y="240" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">Datasets (saved SQL)</text><text x="786" y="264" font-size="13.5" font-weight="500" fill="#1F2A37" text-anchor="start">lead_outcomes</text><text x="888.3125" y="264" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">— one row per lead, one outcome</text><text x="786" y="284" font-size="13.5" font-weight="500" fill="#1F2A37" text-anchor="start">attempt_events</text><text x="891.34375" y="284" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">— what each call or text meant</text><text x="786" y="304" font-size="13.5" font-weight="500" fill="#1F2A37" text-anchor="start">lead_funnel</text><text x="867.390625" y="304" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">— the six-step funnel</text><rect x="770" y="340" width="380" height="112" rx="6" fill="#F4F6F8"/><text x="786" y="364" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">Dashboard: Clever Lead Ledger</text><text x="786" y="390" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Tab 1: The Problem</text><text x="966" y="390" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Tab 2: Where It Breaks</text><text x="786" y="412" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Tab 3: Lead Ledger</text><text x="966" y="412" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Tab 4: Events vs Outcomes</text><rect x="1250" y="140" width="310" height="330" rx="8" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="1270" y="174" font-size="18" font-weight="600" fill="#1F2A37" text-anchor="start">Reviewer’s browser</text><text x="1270" y="196" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">No login, no Preset account</text><rect x="1270" y="216" width="270" height="236" rx="6" fill="#F4F6F8"/><text x="1286" y="240" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">The page from Vercel</text><rect x="1286" y="256" width="238" height="180" rx="4" fill="#FFFFFF" stroke="#24457A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1302" y="290.0" font-size="14" font-weight="600" fill="#24457A" text-anchor="start">Dashboard shown in an iframe</text><text x="1302" y="316" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Loaded with the guest token. The</text><text x="1302" y="334" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">embed library swaps in a fresh</text><text x="1302" y="352" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">token every 5 minutes, so viewing</text><text x="1302" y="370" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">never times out.</text><line x1="296" y1="255" x2="362" y2="255" stroke="#1F2A37" stroke-width="1.5" marker-end="url(#arr)"/><text x="330" y="245" font-size="12.5" font-weight="500" fill="#5B6573" text-anchor="middle">loaded once</text><line x1="676" y1="255" x2="742" y2="255" stroke="#1F2A37" stroke-width="1.5" marker-end="url(#arr)"/><text x="710" y="245" font-size="12.5" font-weight="500" fill="#5B6573" text-anchor="middle">read-only</text><text x="710" y="277" font-size="12.5" font-weight="500" fill="#5B6573" text-anchor="middle">SQL, SSL</text><line x1="1176" y1="360" x2="1284" y2="360" stroke="#24457A" stroke-width="1.5" marker-end="url(#arrb)"/><circle cx="1210" cy="360" r="13" fill="#24457A"/><text x="1210" y="365" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><rect x="870" y="540" width="690" height="190" rx="8" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="890" y="574" font-size="18" font-weight="600" fill="#1F2A37" text-anchor="start">Vercel</text><text x="890" y="596" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Hosts the page and one small function</text><text x="890" y="636" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">index.html</text><text x="890" y="655" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">The page, plus Preset’s embed library</text><rect x="1210" y="614" width="330" height="96" rx="6" fill="#FFFFFF" stroke="#5B6573" stroke-width="1.2" stroke-dasharray="5 4"/><text x="1226" y="638" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">/api/guest-token  (server only)</text><text x="1226" y="658" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Holds the Preset API key. Trades it for a guest</text><text x="1226" y="676" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">token that can view one dashboard.</text><line x1="1440" y1="476" x2="1440" y2="532" stroke="#24457A" stroke-width="1.5" marker-end="url(#arrb)"/><circle cx="1440" cy="505" r="13" fill="#24457A"/><text x="1440" y="510" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><line x1="1500" y1="534" x2="1500" y2="478" stroke="#24457A" stroke-width="1.5" marker-end="url(#arrb)"/><circle cx="1500" cy="505" r="13" fill="#24457A"/><text x="1500" y="510" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><path d="M870,635 L810,635 L810,478" stroke="#24457A" stroke-width="1.5" fill="none" marker-end="url(#arrb)"/><circle cx="810" cy="570" r="13" fill="#24457A"/><text x="810" y="575" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><text x="790" y="574" font-size="12.5" font-weight="500" fill="#5B6573" text-anchor="end">Preset API</text><text x="40" y="560" font-size="16" font-weight="600" fill="#1F2A37" text-anchor="start">What happens when a reviewer opens the link</text><rect x="40" y="577" width="36" height="22" rx="11" fill="#24457A"/><text x="58" y="593" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1–2</text><text x="90" y="592" font-size="13.5" font-weight="400" fill="#1F2A37" text-anchor="start">The browser loads the page from Vercel, which asks /api/guest-token for a pass.</text><rect x="40" y="607" width="36" height="22" rx="11" fill="#24457A"/><text x="58" y="623" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><text x="90" y="622" font-size="13.5" font-weight="400" fill="#1F2A37" text-anchor="start">The function signs in to Preset with the API key and requests a guest token for this one dashboard.</text><rect x="40" y="637" width="36" height="22" rx="11" fill="#24457A"/><text x="58" y="653" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><text x="90" y="652" font-size="13.5" font-weight="400" fill="#1F2A37" text-anchor="start">Preset returns the token; the function passes it to the browser. The API key never leaves Vercel.</text><rect x="40" y="667" width="36" height="22" rx="11" fill="#24457A"/><text x="58" y="683" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text><text x="90" y="682" font-size="13.5" font-weight="400" fill="#1F2A37" text-anchor="start">The embed library opens the dashboard in an iframe using the token, and refreshes it every 5 minutes.</text><text x="40" y="768" font-size="12.5" font-weight="400" fill="#5B6573" text-anchor="start">Data loaded through the Neon MCP server. Datasets and dashboard can be built through the Preset MCP server. Fictionalized extract.</text></svg>