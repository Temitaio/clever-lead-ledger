</defs><rect width="1180" height="322" fill="#FFFFFF"/><text x="0" y="20" font-size="19" font-weight="600" fill="#1F2A37" text-anchor="start">Leads in, outreach out: where the two systems disagree</text><text x="0" y="42" font-size="13.5" font-weight="400" fill="#5B6573" text-anchor="start">Every one of the 379 attempts maps to a known lead. The leakage is in treatment, not record linkage.</text><rect x="0" y="62" width="258" height="74" rx="6" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="16" y="104" font-size="30" font-weight="600" fill="#1F2A37" text-anchor="start">206</text><text x="80.0" y="96" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">leads received</text><text x="80.0" y="114" font-size="12.5" font-weight="400" fill="#5B6573" text-anchor="start">from 6 partners</text><rect x="330" y="62" width="258" height="74" rx="6" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="346" y="104" font-size="30" font-weight="600" fill="#1F2A37" text-anchor="start">188</text><text x="410.0" y="96" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">entered outreach</text><text x="410.0" y="114" font-size="12.5" font-weight="400" fill="#5B6573" text-anchor="start">1 or more attempts</text><rect x="660" y="62" width="258" height="74" rx="6" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.5"/><text x="676" y="104" font-size="30" font-weight="600" fill="#1F2A37" text-anchor="start">379</text><text x="740.0" y="96" font-size="14" font-weight="600" fill="#1F2A37" text-anchor="start">attempts logged</text><text x="740.0" y="114" font-size="12.5" font-weight="400" fill="#5B6573" text-anchor="start">252 calls / 127 texts</text><line x1="262" y1="99.0" x2="324" y2="99.0" stroke="#1F2A37" stroke-width="1.5" marker-end="url(#arr)"/><line x1="592" y1="99.0" x2="654" y2="99.0" stroke="#1F2A37" stroke-width="1.5" marker-end="url(#arr)"/><path d="M292,99.0 L292,162 L328,162" stroke="#B42318" stroke-width="1.5" fill="none" mark